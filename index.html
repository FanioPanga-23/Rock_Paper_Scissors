<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Rock Paper and Scissors</title>
</head>
<body>
    <div class="container">
        <h1>Rock Paper and Scissors</h1>
        <div class="score-box">
            <h2>Score</h2>
            <div class="info">
                <label for="human">You</label>
                <input type="text" id="human" readonly value="0"> :
                <input type="text" id="cpu" readonly value="0">
                <label for="cpu">CPU</label>
            </div>
        </div>
        <div class="choice-container">
            <button class="rock choice-btn">Rock</button>
            <button class="paper choice-btn">Paper</button>
            <button class="scissors choice-btn">Scissors</button>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
